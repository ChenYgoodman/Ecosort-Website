<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Quiz</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/Quiz.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* 语言切换按钮样式 */
        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1001;
        }
        .language-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }
        .language-btn.active {
            background: rgba(255,255,255,0.5);
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- 语言切换按钮 -->
    <div class="language-switcher">
        <button class="language-btn active" data-lang="zh">中文</button>
        <button class="language-btn" data-lang="en">English</button>
    </div>

    <!-- menu -->
    <nav>
        <div class="logo">
            <img src="../image/toux.ico" alt="Logo Image">
        </div>
        <div class="hamburger">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html" data-i18n="home">Home</a></li>
            <li><a href="./Quiz.html" class="active" data-i18n="quiz">Quiz</a></li>
            <li><a href="./Chatbot.html" data-i18n="chatbot">Chatbot</a></li>
        </ul>
    </nav>

    <!-- 主内容 -->
    <div class="main-content">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div id="quizContainer" class="wide-quiz-container">
                        <!-- Start Screen -->
                        <div id="startScreen" class="text-center">
                            <h1 class="mb-4 quiz-title" data-i18n="quiz.title">Quiz</h1>
                            <p class="lead mb-4 quiz-description" data-i18n="quiz.description">Test your knowledge with 10 challenging questions!</p>
                            <button id="startBtn" class="btn btn-primary btn-lg" data-i18n="quiz.start">Start Quiz</button>
                        </div>

                        <!-- Quiz Screen (initially hidden) -->
                        <div id="quizScreen" style="display: none;">
                            <div class="d-flex justify-content-between mb-3">
                                <div id="timer" class="badge bg-danger fs-5">20s</div>
                                <div id="questionCount" class="text-muted" data-i18n="quiz.questionCount">Question 1/10</div>
                            </div>
                            
                            <div class="card shadow-sm mb-4">
                                <div class="card-body">
                                    <h3 id="questionText" class="card-title"></h3>
                                    <div id="optionsContainer" class="mt-3"></div>
                                </div>
                            </div>
                            
                            <button id="nextBtn" class="btn btn-primary" disabled data-i18n="quiz.next">Next Question</button>
                        </div>

                        <!-- Results Screen (initially hidden) -->
                        <div id="resultScreen" style="display: none;">
                            <div class="card shadow-sm">
                                <div class="card-body text-center">
                                    <h2 class="mb-3" data-i18n="quiz.completed">Quiz Completed!</h2>
                                    <p id="scoreText" class="fs-4"></p>
                                    <div class="mt-4">
                                        <button id="restartBtn" class="btn btn-primary" data-i18n="quiz.retake">Retake Quiz</button>
                                        <button id="viewLeaderboardBtn" class="btn btn-secondary ms-2" data-i18n="quiz.viewLeaderboard">View Leaderboard</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Leaderboard Screen (initially hidden) -->
                        <div id="leaderboardScreen" style="display: none;">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h2 class="text-center mb-4" data-i18n="quiz.leaderboard">Leaderboard</h2>
                                    <div class="table-responsive">
                                        <table class="table table-striped">
                                            <thead>
                                                <tr>
                                                    <th data-i18n="quiz.rank">Rank</th>
                                                    <th data-i18n="quiz.score">Score</th>
                                                    <th data-i18n="quiz.time">Time</th>
                                                    <th data-i18n="quiz.date">Date</th>
                                                </tr>
                                            </thead>
                                            <tbody id="leaderboardBody">
                                                <!-- 排行榜数据将通过JS动态填充 -->
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="text-center mt-4">
                                        <button id="backToResultsBtn" class="btn btn-primary" data-i18n="quiz.backToResults">Back to Results</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/Quiz.js"></script>
    <script>
        // 语言切换功能
        document.addEventListener('DOMContentLoaded', function() {
            const languageBtns = document.querySelectorAll('.language-btn');
            const defaultLanguage = 'zh';
            let currentLanguage = localStorage.getItem('language') || defaultLanguage;
            
            // 设置初始语言
            setLanguage(currentLanguage);
            
            // 添加按钮点击事件
            languageBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const lang = this.getAttribute('data-lang');
                    setLanguage(lang);
                    localStorage.setItem('language', lang);
                    
                    // 更新按钮状态
                    languageBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
                
                // 设置初始按钮状态
                if (btn.getAttribute('data-lang') === currentLanguage) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // 确保Quiz.js中的问题也能被翻译
            if (window.quizQuestions) {
                translateQuestions(currentLanguage);
            }
        });
        
        // 设置页面语言
        function setLanguage(lang) {
            const translations = {
                'zh': {
                    'home': '首页',
                    'quiz': '知识测验',
                    'chatbot': '智能助手',
                    'quiz.title': '垃圾分类知识测验',
                    'quiz.description': '挑战10个垃圾分类相关问题，测试你的知识水平！',
                    'quiz.start': '开始测验',
                    'quiz.questionCount': '问题 1/10',
                    'quiz.next': '下一题',
                    'quiz.completed': '测验完成！',
                    'quiz.retake': '重新测验',
                    'quiz.leaderboard': '排行榜',
                    'quiz.rank': '排名',
                    'quiz.score': '得分',
                    'quiz.time': '用时',
                    'quiz.date': '日期',
                    'quiz.backToResults': '返回结果',
                    'quiz.viewLeaderboard': '查看排行榜'
                },
                'en': {
                    'home': 'Home',
                    'quiz': 'Quiz',
                    'chatbot': 'Chatbot',
                    'quiz.title': 'Waste Sorting Quiz',
                    'quiz.description': 'Test your knowledge with 10 challenging questions!',
                    'quiz.start': 'Start Quiz',
                    'quiz.questionCount': 'Question 1/10',
                    'quiz.next': 'Next Question',
                    'quiz.completed': 'Quiz Completed!',
                    'quiz.retake': 'Retake Quiz',
                    'quiz.leaderboard': 'Leaderboard',
                    'quiz.rank': 'Rank',
                    'quiz.score': 'Score',
                    'quiz.time': 'Time',
                    'quiz.date': 'Date',
                    'quiz.backToResults': 'Back to Results',
                    'quiz.viewLeaderboard': 'View Leaderboard'
                }
            };
            
            // 更新所有带有data-i18n属性的元素
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
            
            // 翻译问题（如果Quiz.js已加载）
            if (window.quizQuestions) {
                translateQuestions(lang);
            }
        }
        
        // 翻译问题
        function translateQuestions(lang) {
            const questionTranslations = {
                'zh': [
                    {
                        question: "铝罐属于哪类垃圾？",
                        options: ["可回收物", "有害垃圾", "厨余垃圾", "其他垃圾"],
                        answer: "可回收物"
                    },
                    {
                        question: "废电池应该投放到哪个垃圾桶？",
                        options: ["可回收物", "有害垃圾", "厨余垃圾", "其他垃圾"],
                        answer: "有害垃圾"
                    },
                    // 其他问题的中文翻译...
                ],
                'en': [
                    {
                        question: "Which category does an aluminum can belong to?",
                        options: ["Recyclables", "Hazardous Waste", "Kitchen Waste", "Other Waste"],
                        answer: "Recyclables"
                    },
                    {
                        question: "Where should you dispose of used batteries?",
                        options: ["Recyclables", "Hazardous Waste", "Kitchen Waste", "Other Waste"],
                        answer: "Hazardous Waste"
                    },
                    // 其他问题的英文翻译...
                ]
            };
            
            if (questionTranslations[lang]) {
                window.quizQuestions = questionTranslations[lang];
                
                // 如果测验正在进行，更新当前问题
                if (document.getElementById('quizScreen').style.display !== 'none') {
                    // 这里需要根据你的Quiz.js实现来更新当前问题
                    // 可能需要调用Quiz.js中的某个函数来刷新问题显示
                }
            }
        }
    </script>
</body>
</html>
