<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            padding-top: 64px;
            height: calc(100vh - 64px);
            display: flex;
            flex-direction: column;
        }
        .chat-container {
            flex: 1;
            width: 80%;
            margin: 20px auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            padding: 24px 16px 16px 16px;
            display: flex;
            flex-direction: column;
            height: calc(100% - 40px);
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 16px;
            background: #f8f9fa;
            margin-bottom: 16px;
            min-height: 0;
        }
        .chat-msg {
            margin-bottom: 18px;
            display: flex;
            align-items: flex-end;
        }
        .chat-msg.user {
            flex-direction: row-reverse;
        }
        .chat-msg .msg {
            max-width: 70%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 1rem;
        }
        .chat-msg.user .msg {
            background: #007bff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .chat-msg.bot .msg {
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        .chat-msg img {
            max-width: 120px;
            max-height: 120px;
            border-radius: 8px;
            margin: 0 8px;
        }
        .new-dialog-btn {
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <img src="../image/toux.ico" alt="Logo Image">
        </div>
        <div class="hamburger">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="./Quiz.html">Quiz</a></li>
            <li><a href="./Chatbot.html">Chatbot</a></li>
        </ul>
    </nav>
    <div class="chat-container">
        <button class="btn btn-outline-secondary new-dialog-btn w-100" onclick="newDialog()">新建对话</button>
        <div class="chat-box" id="chatBox"></div>
        <form id="chatForm" class="d-flex gap-2" onsubmit="return sendMessage(event)">
            <input type="text" id="messageInput" class="form-control" placeholder="请输入问题或描述..." autocomplete="off">
            <input type="file" id="imageInput" accept="image/*" class="form-control" style="max-width: 180px;">
            <button class="btn btn-primary" type="submit">发送</button>
        </form>
    </div>
    <script src="https://cdn.bootcdn.net/ajax/libs/axios/1.6.7/axios.min.js"></script>
    <script>
        const baseUrl = 'http://175.178.59.253:5001'
        let chatHistory = [];
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const imageInput = document.getElementById('imageInput');

        function renderChat() {
            chatBox.innerHTML = '';
            chatHistory.forEach(item => {
                console.log("格式化处理后的结果: ",formatBotMsg(item.text))
                const div = document.createElement('div');
                div.className = 'chat-msg ' + item.role;
                let html = '';
                if(item.image) {
                    html += `<img src="${item.image}" alt="图片">`;
                }
                html += `<div class="msg" style="white-space:normal;">${item.role === 'bot' ? formatBotMsg(item.text) : item.text}</div>`;
                div.innerHTML = html;
                chatBox.appendChild(div);
            });
           
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function newDialog() {
            chatHistory = [];
            renderChat();
        }

        function formatBotMsg(text) {
            let html = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            html = html.replace(/(\\\\r\\\\n|\\\\n|\\\\r|\\r\\n|\\n|\\r|\r\n|\n|\r)/g, ' ');
            html = html.replace(/^"|"$/g, '');
            html = html.replace(/\s{2,}/g, ' ');
            return html.trim();
        }

        async function sendMessage(e) {
            e.preventDefault();
            const text = messageInput.value.trim();
            const file = imageInput.files[0];
            if(!text && !file) return;
            let userMsg = { role: 'user', text, image: '' };
            if(file) {
                userMsg.image = URL.createObjectURL(file);
            }
            chatHistory.push(userMsg);
            renderChat();
            messageInput.value = '';
            imageInput.value = '';

            let image_url = '';
            if(file) {
                // 上传图片
                const formData = new FormData();
                formData.append('file', file);
                try {
                    const uploadRes = await axios.post(`${baseUrl}/upload`, formData, {
                        headers: { 'Content-Type': 'multipart/form-data' }
                    });
                    image_url = uploadRes.data.image_url;
                } catch(err) {
                    chatHistory.push({ role: 'bot', text: '图片上传失败，请重试', image: '' });
                    renderChat();
                    return;
                }
            }
            // 发送到/chat
            try {
                const body = { message: text };
                if(image_url) body.image_url = image_url;
                const chatRes = await axios.post(`${baseUrl}/chat`, body);
                let botMsg = chatRes.data.message || JSON.stringify(chatRes.data);
                chatHistory.push({ role: 'bot', text: botMsg, image: '' });
                renderChat();
            } catch(err) {
                chatHistory.push({ role: 'bot', text: '服务异常或无结果', image: '' });
                renderChat();
            }
        }
    </script>
</body>
</html>
